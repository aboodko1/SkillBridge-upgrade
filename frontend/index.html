<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const appearance = localStorage.getItem('sb_appearance') || localStorage.getItem('sb_theme') || 'system';
        const resolved = appearance === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : appearance;
        document.documentElement.dataset.theme = resolved === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.appearance = appearance;
        document.documentElement.dataset.interface = localStorage.getItem('sb_interface') === 'casual-pulse' ? 'casual-pulse' : 'professional';
      } catch (_) {}
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillBridge — Career Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/skillbridge-mark.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
