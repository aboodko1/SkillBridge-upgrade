name: Build and focused tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck and build
        run: npm run build --prefix frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run focused offline regression tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_matching.py
          tests/test_auth_sessions_phaseC.py
          tests/test_brightdata_jobs.py
          tests/test_job_provenance_phaseF.py
          tests/test_match_explainability_phaseJ.py
          tests/test_data_truth_phase2.py
          tests/test_tour_state_phase4.py

      - name: Run phase learning and assessment truth tests
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/test_lessons.py
          tests/test_learning_practice.py
          tests/test_assessment.py
          tests/test_final_assessment_exit.py
          tests/test_webcam_integrity.py
