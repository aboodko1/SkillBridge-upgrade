name: Feature request
description: Propose a user-centered improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: dropdown
    id: audience
    attributes:
      label: Primary audience
      options: [Student, Company, University, All users]
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem before describing the interface.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: truth
    attributes:
      label: Data and honesty requirements
      description: State which data is real, cached, generated, inferred, or unavailable.
